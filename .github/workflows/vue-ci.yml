name: Continuous Integration - Frontend

on:
  pull_request:
    branches: [ "master" ]

jobs:
  ci:
    name: 🎉 Frontend Integration
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build project
        run: |
          cd frontend
          npm run build

      - name: Code-Fixer
        run: |
          cd frontend
          npm run format
