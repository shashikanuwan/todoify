name: Continuous Integration - Frontend

on:
  pull_request:
    branches: [ "master" ]

jobs:
  ci:
    name: 🎉 Frontend Integration
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: Copy .env
        run: |
          cd backend
          php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build project
        run: npm run build

      - name: Code-Fixer
        run: |
          cd frontend
          npm run format
